[project]
name = "content-generation-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "redis>=5,<6",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1",
  "python-multipart>=0.0.9,<1",
  "arq>=0.26,<1",
  "alembic>=1.14,<2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "ruff>=0.8", "black>=24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends/Header declarations intentionally call factories in defaults.
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
